name: Release

# One-click version bump. Pick a package and a bump type; this commits the new version
# to main, which starts publish.yml. That workflow publishes to npm, tags the commit as
# <package>-v<version> and creates the GitHub Release.
#
# The push uses RELEASE_TOKEN (a fine-grained GitHub token with Contents: read and write
# on this repo), because pushes made with the default GITHUB_TOKEN do not start other
# workflows.

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to release'
        required: true
        type: choice
        default: sdk
        options:
          - sdk
          - types
          - cli
      bump:
        description: 'Version bump (ignored if custom_version is set)'
        required: false
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      custom_version:
        description: 'Exact version, e.g. 2.0.1 or 2.1.0-rc.1. Leave empty to bump.'
        required: false
        type: string

jobs:
  bump:
    name: Bump version
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-node@v4.1.0
        with:
          node-version: 22.x

      - name: Bump and push
        env:
          PKG: ${{ inputs.package }}
          BUMP: ${{ inputs.bump }}
          CUSTOM: ${{ inputs.custom_version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          TARGET="${CUSTOM:-$BUMP}"
          npm version "$TARGET" --no-git-tag-version --workspace "packages/$PKG"
          VERSION=$(node -p "require('./packages/$PKG/package.json').version")
          NAME=$(node -p "require('./packages/$PKG/package.json').name")

          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::error::$NAME@$VERSION is already on npm. Pick another version."
            exit 1
          fi

          git add "packages/$PKG/package.json" package-lock.json
          git commit -m "chore: release $PKG-v$VERSION"
          git push origin HEAD:main
          echo "Pushed $NAME@$VERSION. publish.yml will publish it to npm and create the release."
