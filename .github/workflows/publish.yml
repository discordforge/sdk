name: Publish to npm

# Triggered when a GitHub Release is published (or run by hand). Builds every
# workspace and publishes each package whose current version is not on npm yet,
# in dependency order: @discordforgejs/types, @discordforgejs/sdk, then @discordforgejs/cli.
#
# Setup:
#   1. On an npm account that can write to the @discordforgejs org, create a
#      Granular Access Token with read and write access to @discordforgejs.
#   2. Add it as a repo secret: Settings -> Secrets and variables -> Actions
#      Name: NPM_TOKEN
#   3. Gated by "npm" environment reviewers.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.1.0
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org

      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          PKG="${TAG%-v*}"
          TAG_VERSION="${TAG##*-v}"
          if [ ! -f "packages/$PKG/package.json" ]; then
            echo "::error::Tag $TAG does not name a package (expected <package>-v<version>, e.g. sdk-v2.0.0)"
            exit 1
          fi
          PKG_VERSION=$(node -p "require('./packages/$PKG/package.json').version")
          echo "Git tag:                       $TAG"
          echo "packages/$PKG/package.json:   $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match packages/$PKG/package.json ($PKG_VERSION)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish unpublished versions
        run: |
          set -e
          for DIR in types sdk cli; do
            NAME=$(node -p "require('./packages/$DIR/package.json').name")
            VERSION=$(node -p "require('./packages/$DIR/package.json').version")
            if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo "✓ $NAME@$VERSION is already on npm, skipping"
            else
              echo "→ Publishing $NAME@$VERSION"
              npm publish --workspace "packages/$DIR" --access public --provenance
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
